[project]
name = "tdf"
version = "0.1.0-alpha.1"
description = "TestDataFactory — 自动化测试数据工厂"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "gwj", email = "sfwwslm@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/guowenju/tdf"
Issues = "https://github.com/guowenju/tdf/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdf"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.11", "mypy>=1.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tdf"]
mypy_path = "src"
