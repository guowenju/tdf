name: Publish to PyPI
run-name: "tdf ${{ inputs.version }} to PyPI"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without tag prefix, for example 0.1.0-alpha.1
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

concurrency:
  group: tdf-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Releases must be published from main, got: $RELEASE_REF"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group dev
      - name: Resolve release
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          raw = os.environ["RELEASE_VERSION"]
          version = Version(raw)
          if raw != raw.strip() or not raw[0].isdigit() or version.local is not None:
              raise ValueError("Use a public package version without a tag prefix")
          with open("pyproject.toml", "rb") as manifest:
              package_version = tomllib.load(manifest)["project"]["version"]
          if version != Version(package_version):
              raise ValueError(f"Version mismatch: input={raw}, package={package_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
              output.write(f"release_name=tdf {version}\n")
              output.write(f"prerelease={str(version.is_prerelease or version.is_devrelease).lower()}\n")
          PY
      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi
      - run: uv run --no-sync pytest
      - run: uv build
      - name: Check distributions
        run: uvx --from twine twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          RELEASE_FLAGS=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}"
